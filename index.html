<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Shop - E-commerce Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', Arial, sans-serif;
            /* Animated gradient background */
            background: linear-gradient(-45deg, #f1f3f6, #e3e9f7, #f9f6e7, #e0f7fa);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }
        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
        .navbar {
            background: #2874f0;
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 2em;
            height: 64px;
            box-shadow: 0 4px 24px #2874f033, 0 2px 8px #0001;
            position: sticky;
            top: 0;
            z-index: 20;
        }
        .navbar .logo {
            font-size: 2em;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffe500;
            margin-right: 2em;
            text-shadow: 0 2px 8px #0002;
            transition: color 0.2s;
        }
        .navbar .logo:hover {
            color: #fff;
        }
        .navbar .search-box {
            flex: 1;
            display: flex;
            align-items: center;
        }
        .navbar input[type="text"] {
            width: 100%;
            padding: 0.7em 1em;
            border: none;
            border-radius: 4px 0 0 4px;
            font-size: 1em;
            background: #f1f3f6;
            transition: box-shadow 0.2s;
        }
        .navbar input[type="text"]:focus {
            outline: none;
            box-shadow: 0 0 0 2px #ffe50055;
        }
        .navbar button.search-btn {
            background: #ffe500;
            color: #2874f0;
            border: none;
            padding: 0.7em 1.2em;
            border-radius: 0 4px 4px 0;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .navbar button.search-btn:hover {
            background: #fff;
            color: #2874f0;
        }
        .navbar .cart-btn, .navbar .user-btn {
            background: #fff;
            color: #2874f0;
            border: none;
            margin-left: 1.2em;
            padding: 0.7em 1.5em;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 1em;
            box-shadow: 0 2px 8px #2874f022;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
        }
        .navbar .cart-btn:hover, .navbar .user-btn:hover {
            background: #ffe500;
            color: #2874f0;
            box-shadow: 0 4px 16px #ffe50033;
        }
        .navbar .cart-btn span {
            margin-left: 0.5em;
        }
        /* Category Chips */
        .category-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7em;
            justify-content: center;
            margin: 2em auto 1em auto;
            max-width: 1200px;
        }
        .chip {
            background: #fff;
            color: #2874f0;
            border: 1.5px solid #2874f0;
            border-radius: 20px;
            padding: 0.5em 1.3em;
            font-size: 1em;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border 0.2s;
            box-shadow: 0 2px 8px #2874f022;
        }
        .chip.active, .chip:hover {
            background: #2874f0;
            color: #fff;
            border: 1.5px solid #ffe500;
        }
        .main {
            max-width: 1200px;
            margin: 0 auto 2em auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 2em;
            height: 70vh;
            overflow-y: auto;
            padding-bottom: 2em;
            background: rgba(255,255,255,0.05);
            border-radius: 18px;
            box-shadow: 0 4px 24px #2874f022;
        }
        .product {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 2px 12px #2874f022, 0 2px 8px #0001;
            padding: 1.5em 1em 1em 1em;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: box-shadow 0.2s, transform 0.2s;
            position: relative;
        }
        .product:hover {
            box-shadow: 0 8px 32px #2874f044;
            transform: translateY(-6px) scale(1.03);
        }
        .product img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 1em;
            border-radius: 10px;
            background: #f1f3f6;
            box-shadow: 0 2px 8px #2874f011;
        }
        .product .name {
            font-size: 1.15em;
            font-weight: 700;
            margin-bottom: 0.5em;
            text-align: center;
            color: #2874f0;
        }
        .product .price {
            color: #388e3c;
            font-size: 1.1em;
            font-weight: 700;
            margin-bottom: 1em;
        }
        .product button {
            background: linear-gradient(90deg, #ff9f00 60%, #ffe500 100%);
            color: #fff;
            border: none;
            padding: 0.7em 2em;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            box-shadow: 0 2px 8px #ff9f0022;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
        }
        .product button:hover {
            background: linear-gradient(90deg, #ffe500 60%, #ff9f00 100%);
            color: #2874f0;
            box-shadow: 0 4px 16px #ffe50033;
        }
        /* Cart Sidebar */
        .cart-sidebar {
            position: fixed;
            top: 0; right: -400px;
            width: 350px;
            height: 100vh;
            background: #fff;
            box-shadow: -2px 0 24px #2874f044;
            z-index: 100;
            transition: right 0.3s;
            display: flex;
            flex-direction: column;
            border-radius: 18px 0 0 18px;
        }
        .cart-sidebar.open {
            right: 0;
        }
        .cart-header {
            background: linear-gradient(90deg, #2874f0 80%, #ffe500 100%);
            color: #fff;
            padding: 1.2em;
            font-size: 1.2em;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 18px 0 0 0;
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1em;
        }
        .cart-item {
            display: flex;
            align-items: center;
            margin-bottom: 1em;
            background: #f1f3f6;
            border-radius: 8px;
            padding: 0.5em;
            box-shadow: 0 2px 8px #2874f011;
        }
        .cart-item img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            margin-right: 1em;
            border-radius: 6px;
        }
        .cart-item .cart-item-info {
            flex: 1;
        }
        .cart-item .cart-item-name {
            font-size: 1em;
            font-weight: 500;
            color: #2874f0;
        }
        .cart-item .cart-item-price {
            color: #388e3c;
            font-size: 1em;
            font-weight: 700;
        }
        .cart-item .remove-btn {
            background: none;
            border: none;
            color: #fb641b;
            font-size: 1.2em;
            cursor: pointer;
            margin-left: 0.5em;
            transition: color 0.2s;
        }
        .cart-item .remove-btn:hover {
            color: #d32f2f;
        }
        .cart-footer {
            padding: 1em;
            border-top: 1px solid #eee;
            background: #fafafa;
            border-radius: 0 0 0 18px;
        }
        .cart-footer .total {
            font-size: 1.1em;
            font-weight: bold;
            color: #2874f0;
        }
        .cart-footer button {
            background: linear-gradient(90deg, #388e3c 60%, #2874f0 100%);
            color: #fff;
            border: none;
            padding: 0.7em 2em;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1em;
            width: 100%;
            font-size: 1.1em;
            box-shadow: 0 2px 8px #388e3c22;
            transition: background 0.2s, color 0.2s;
        }
        .cart-footer button:hover {
            background: linear-gradient(90deg, #2874f0 60%, #388e3c 100%);
            color: #ffe500;
        }
        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(40,116,240,0.12);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-window {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 #2874f044, 0 2px 8px #0001;
            padding: 2.5em 2em 2em 2em;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            animation: modalPop 0.3s cubic-bezier(.68,-0.55,.27,1.55);
        }
        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-title {
            font-size: 1.4em;
            font-weight: 700;
            color: #2874f0;
            margin-bottom: 1.2em;
            letter-spacing: 1px;
        }
        .modal-window input {
            width: 220px;
            padding: 0.7em 1em;
            margin-bottom: 1em;
            border-radius: 8px;
            border: 1.5px solid #2874f0;
            font-size: 1em;
            background: #f1f3f6;
            outline: none;
            transition: border 0.2s;
        }
        .modal-window input:focus {
            border: 2px solid #ff9f00;
        }
        .modal-window button {
            background: linear-gradient(90deg, #2874f0 60%, #ffe500 100%);
            color: #fff;
            border: none;
            padding: 0.8em 2em;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            box-shadow: 0 2px 8px #2874f033;
            transition: background 0.3s, color 0.3s;
            margin-bottom: 0.5em;
        }
        .modal-window button:hover {
            background: linear-gradient(90deg, #ffe500 60%, #2874f0 100%);
            color: #2874f0;
        }
        .modal-switch {
            font-size: 0.95em;
            margin-top: 0.5em;
            color: #555;
        }
        .modal-switch a {
            color: #2874f0;
            text-decoration: underline;
            cursor: pointer;
        }
        .modal-error {
            color: #d32f2f;
            margin-top: 0.7em;
            font-weight: bold;
            min-height: 1.5em;
        }
        .modal-close-btn {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 1.7em;
            cursor: pointer;
            color: #2874f0;
            background: none;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }
        .modal-close-btn:hover {
            background: #f1f3f6;
            color: #d32f2f;
        }
        .footer {
            width: 100vw;
            background: linear-gradient(90deg, #2874f0 80%, #ffe500 100%);
            color: #ffe500;
            text-align: center;
            font-size: 1em;
            font-family: 'Roboto', Arial, sans-serif;
            font-weight: 500;
            padding: 16px 0 12px 0;
            position: fixed;
            left: 0; bottom: 0;
            z-index: 10;
            border-top: 1.5px solid #ffe500;
            box-shadow: 0 -2px 8px #2874f033;
            letter-spacing: 1px;
        }
        @media (max-width: 900px) {
            .main {
                grid-template-columns: 1fr 1fr;
                gap: 1em;
            }
            .category-chips {
                gap: 0.4em;
            }
        }
        @media (max-width: 700px) {
            .main {
                grid-template-columns: 1fr;
                gap: 1em;
                height: auto;
            }
            .cart-sidebar {
                width: 100vw;
                border-radius: 0;
            }
            .category-chips {
                flex-direction: column;
                align-items: center;
            }
        }
        @media (max-width: 500px) {
            .navbar {
                flex-direction: column;
                height: auto;
                padding: 1em 0.5em;
            }
            .main {
                padding-bottom: 4em;
            }
            .footer {
                font-size: 0.9em;
                padding: 10px 0 8px 0;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <span class="logo">ClassicShop</span>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for products, brands and more...">
            <button class="search-btn" onclick="searchProducts()">Search</button>
        </div>
        <button class="cart-btn" onclick="toggleCart()">
            🛒 <span id="cart-count">0</span>
        </button>
        <button class="user-btn" id="userBtn" onclick="openLoginModal()">
            <span id="userIcon">👤 Login</span>
        </button>
    </div>
    <div class="category-chips" id="categoryChips">
        <!-- Category chips will be rendered here -->
    </div>
    <div class="main" id="product-list">
        <!-- Products will be rendered here -->
    </div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <span>My Cart</span>
            <span style="cursor:pointer;" onclick="toggleCart()">✖</span>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="total">Total: ₹<span id="cartTotal">0</span></div>
            <button onclick="checkout()">Checkout</button>
        </div>
    </div>
    <!-- Login/Signup Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-window" id="loginWindow">
            <button class="modal-close-btn" onclick="closeModal()" aria-label="Close">&times;</button>
            <div class="modal-title">Login</div>
            <button class="social-login-btn google-btn" onclick="googleLogin()">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="22" height="22" style="vertical-align:middle;"> Login with Google
            </button>
            <button class="social-login-btn phone-btn" onclick="phoneLogin()">
                <img src="https://www.svgrepo.com/show/485623/phone.svg" alt="Phone" width="20" height="20" style="vertical-align:middle;"> Login with Phone
            </button>
            <div style="margin: 1em 0; color: #888;">or</div>
            <input type="text" id="login-username" placeholder="Username" required autofocus />
            <input type="password" id="login-password" placeholder="Password" required />
            <button onclick="loginUser()">Login</button>
            <div class="modal-switch">New user? <a href="#" onclick="showSignupWindow();return false;">Create an account</a></div>
            <div class="modal-error" id="loginError"></div>
        </div>
        <div class="modal-window" id="signupWindow" style="display:none;">
            <button class="modal-close-btn" onclick="closeModal()" aria-label="Close">&times;</button>
            <div class="modal-title">Create Account</div>
            <input type="text" id="signup-name" placeholder="Full Name" required />
            <input type="email" id="signup-email" placeholder="Email" required />
            <input type="text" id="signup-username" placeholder="Username" required />
            <input type="password" id="signup-password" placeholder="Password" required />
            <button onclick="signupUser()">Sign Up</button>
            <div class="modal-switch">Already have an account? <a href="#" onclick="showLoginWindow();return false;">Login</a></div>
            <div class="modal-error" id="signupError"></div>
        </div>
    </div>
    <div class="footer">
        &copy; 2024 ClassicShop. All rights reserved.
    </div>
    <script>
        const products = [
            // Electronics
            {id:1, name:'Wireless Headphones', price:1999, img:'https://m.media-amazon.com/images/I/61CGHv6kmWL._AC_UY218_.jpg', category:'Electronics'},
            {id:2, name:'Smartphone', price:12999, img:'https://m.media-amazon.com/images/I/71hIfcIPyxS._AC_UY218_.jpg', category:'Electronics'},
            {id:3, name:'Bluetooth Speaker', price:899, img:'https://m.media-amazon.com/images/I/71l2j7p8GML._AC_UY218_.jpg', category:'Electronics'},
            {id:4, name:'Laptop', price:45999, img:'https://m.media-amazon.com/images/I/71c5U8hhXLL._AC_UY218_.jpg', category:'Electronics'},
            // Fashion
            {id:5, name:'Sports Shoes', price:2499, img:'https://m.media-amazon.com/images/I/71vFKBpKakL._AC_UL320_.jpg', category:'Fashion'},
            {id:6, name:'Analog Watch', price:1499, img:'https://m.media-amazon.com/images/I/71r69YQF1LL._AC_UL320_.jpg', category:'Fashion'},
            {id:7, name:'Backpack', price:799, img:'https://m.media-amazon.com/images/I/81QpkIctqPL._AC_UL320_.jpg', category:'Fashion'},
            {id:8, name:'Sunglasses', price:599, img:'https://m.media-amazon.com/images/I/61o1v6u3QnL._AC_UL320_.jpg', category:'Fashion'},
            // Home & Kitchen
            {id:9, name:'Non-stick Fry Pan', price:499, img:'https://m.media-amazon.com/images/I/71n2bJQ2pPL._AC_UL320_.jpg', category:'Home'},
            {id:10, name:'LED Table Lamp', price:699, img:'https://m.media-amazon.com/images/I/61Qe0euJJZL._AC_UL320_.jpg', category:'Home'},
            {id:11, name:'Bedsheet Set', price:999, img:'https://m.media-amazon.com/images/I/81QpkIctqPL._AC_UL320_.jpg', category:'Home'},
            // Books
            {id:12, name:'The Alchemist', price:299, img:'https://m.media-amazon.com/images/I/81pL3gF1YwL._AC_UL320_.jpg', category:'Books'},
            {id:13, name:'Atomic Habits', price:399, img:'https://m.media-amazon.com/images/I/91bYsX41DVL._AC_UL320_.jpg', category:'Books'},
            // Toys
            {id:14, name:'Remote Car', price:799, img:'https://m.media-amazon.com/images/I/81X6VQYb8bL._AC_UL320_.jpg', category:'Toys'},
            {id:15, name:'Building Blocks', price:499, img:'https://m.media-amazon.com/images/I/81Zt42ioCgL._AC_UL320_.jpg', category:'Toys'},
            // Groceries
            {id:16, name:'Basmati Rice 5kg', price:499, img:'https://m.media-amazon.com/images/I/81QpkIctqPL._AC_UL320_.jpg', category:'Groceries'},
            {id:17, name:'Sunflower Oil 1L', price:149, img:'https://m.media-amazon.com/images/I/81QpkIctqPL._AC_UL320_.jpg', category:'Groceries'},
            // Beauty
            {id:18, name:'Face Wash', price:199, img:'https://m.media-amazon.com/images/I/71Qe0euJJZL._AC_UL320_.jpg', category:'Beauty'},
            {id:19, name:'Lipstick', price:299, img:'https://m.media-amazon.com/images/I/81pL3gF1YwL._AC_UL320_.jpg', category:'Beauty'},
            // Sports
            {id:20, name:'Football', price:599, img:'https://m.media-amazon.com/images/I/81X6VQYb8bL._AC_UL320_.jpg', category:'Sports'},
            {id:21, name:'Yoga Mat', price:399, img:'https://m.media-amazon.com/images/I/81Zt42ioCgL._AC_UL320_.jpg', category:'Sports'},
            // More
            {id:22, name:'Fitness Band', price:1799, img:'https://m.media-amazon.com/images/I/61ZRU9gnbxL._AC_UL320_.jpg', category:'Electronics'},
            {id:23, name:'Wireless Mouse', price:499, img:'https://m.media-amazon.com/images/I/61LtuGzXeaL._AC_UL320_.jpg', category:'Electronics'},
            {id:24, name:'Coffee Mug', price:199, img:'https://m.media-amazon.com/images/I/71n2bJQ2pPL._AC_UL320_.jpg', category:'Home'},
            {id:25, name:'Notebook', price:99, img:'https://m.media-amazon.com/images/I/81pL3gF1YwL._AC_UL320_.jpg', category:'Books'},
        ];
        let cart = [];
        // Add category filter chips
        const categories = [
            "All", "Electronics", "Fashion", "Home", "Books", "Toys", "Groceries", "Beauty", "Sports"
        ];
        let selectedCategory = "All";
        function renderCategoryChips() {
            const chips = categories.map(cat =>
                `<span class="chip${selectedCategory === cat ? ' active' : ''}" onclick="filterByCategory('${cat}')">${cat}</span>`
            ).join('');
            document.getElementById('categoryChips').innerHTML = chips;
        }
        function filterByCategory(cat) {
            selectedCategory = cat;
            renderCategoryChips();
            if (cat === "All") {
                renderProducts(products);
            } else {
                renderProducts(products.filter(p => p.category === cat));
            }
        }
        function renderProducts(list) {
            const container = document.getElementById('product-list');
            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#2874f0; font-size:1.2em; padding:2em;">No products found.</div>`;
                return;
            }
            list.forEach(p => {
                container.innerHTML += `
                <div class="product">
                    <img src="${p.img}" alt="${p.name}">
                    <div class="name">${p.name}</div>
                    <div class="price">₹${p.price}</div>
                    <button onclick="addToCart(${p.id})">Add to Cart</button>
                </div>`;
            });
        }
        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if(existing) existing.qty++;
            else cart.push({...prod, qty:1});
            updateCartCount();
        }
        function updateCartCount() {
            document.getElementById('cart-count').textContent = cart.reduce((a,b)=>a+b.qty,0);
        }
        function toggleCart() {
            const sidebar = document.getElementById('cartSidebar');
            sidebar.classList.toggle('open');
            renderCart();
        }
        function renderCart() {
            const items = document.getElementById('cartItems');
            items.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price * item.qty;
                items.innerHTML += `
                <div class="cart-item">
                    <img src="${item.img}" alt="${item.name}">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">₹${item.price} x ${item.qty}</div>
                    </div>
                    <button class="remove-btn" onclick="removeFromCart(${item.id})">✖</button>
                </div>`;
            });
            document.getElementById('cartTotal').textContent = total;
        }
        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartCount();
            renderCart();
        }
        function checkout() {
            if(cart.length === 0) { alert('Your cart is empty!'); return; }
            if(!currentUser) {
                closeModal(); // close cart if open
                openLoginModal();
                alert('Please log in or sign up to checkout.');
                return;
            }
            alert('Thank you for shopping with us, ' + currentUser.name + '!');
            cart = [];
            updateCartCount();
            renderCart();
            toggleCart();
        }
        function searchProducts() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            let filtered = products.filter(p => p.name.toLowerCase().includes(q));
            if (selectedCategory !== "All") {
                filtered = filtered.filter(p => p.category === selectedCategory);
            }
            renderProducts(filtered);
        }
        // User storage (localStorage for demo)
        function getUsers() {
            return JSON.parse(localStorage.getItem('shop_users') || '[]');
        }
        function saveUser(user) {
            const users = getUsers();
            users.push(user);
            localStorage.setItem('shop_users', JSON.stringify(users));
        }
        function findUser(username, password) {
            const users = getUsers();
            return users.find(u => u.username === username && u.password === password);
        }
        function findUserByUsername(username) {
            const users = getUsers();
            return users.find(u => u.username === username);
        }
        // Modal logic
        const modalOverlay = document.getElementById('modalOverlay');
        const loginWindow = document.getElementById('loginWindow');
        const signupWindow = document.getElementById('signupWindow');
        const loginError = document.getElementById('loginError');
        const signupError = document.getElementById('signupError');
        const userBtn = document.getElementById('userBtn');
        const userIcon = document.getElementById('userIcon');
        let currentUser = null;
        function openLoginModal() {
            modalOverlay.classList.add('active');
            loginWindow.style.display = 'flex';
            signupWindow.style.display = 'none';
            loginError.textContent = '';
            signupError.textContent = '';
        }
        function closeModal() {
            modalOverlay.classList.remove('active');
        }
        function showSignupWindow() {
            loginWindow.style.display = 'none';
            signupWindow.style.display = 'flex';
            signupError.textContent = '';
        }
        function showLoginWindow() {
            signupWindow.style.display = 'none';
            loginWindow.style.display = 'flex';
            loginError.textContent = '';
        }
        modalOverlay.onclick = function(e) {
            if(e.target === modalOverlay) closeModal();
        };
        function loginUser() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            if (!username || !password) {
                loginError.textContent = 'Please enter username and password.';
                return;
            }
            const user = findUser(username, password);
            if (user) {
                currentUser = user;
                userIcon.textContent = `👋 ${user.name}`;
                userBtn.onclick = logoutUser;
                closeModal();
            } else {
                loginError.textContent = 'Invalid username or password.';
            }
        }
        function signupUser() {
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const username = document.getElementById('signup-username').value.trim();
            const password = document.getElementById('signup-password').value;
            if (!name || !email || !username || !password) {
                signupError.textContent = 'All fields are required.';
                return;
            }
            if (findUserByUsername(username)) {
                signupError.textContent = 'Username already exists.';
                return;
            }
            saveUser({ name, email, username, password });
            signupError.textContent = '';
            showLoginWindow();
            loginError.textContent = 'Account created! Please log in.';
        }
        function logoutUser() {
            currentUser = null;
            userIcon.textContent = '👤 Login';
            userBtn.onclick = openLoginModal;
        }
        // Google and Phone Login (calls backend endpoints)
        function googleLogin() {
            fetch('http://localhost:4000/auth/google', { method: 'GET', credentials: 'include' })
                .then(res => {
                    if (res.redirected) {
                        window.location = res.url;
                    } else {
                        alert('Google login endpoint called. (Requires backend OAuth setup.)');
                    }
                })
                .catch(() => alert('Google login is not available.'));
        }
        function phoneLogin() {
            const phone = prompt('Enter your phone number:');
            if (!phone) return;
            fetch('http://localhost:4000/auth/phone', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('OTP sent to your phone (demo).');
                    const otp = prompt('Enter OTP:');
                    if (!otp) return;
                    fetch('http://localhost:4000/auth/verify-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone, otp })
                    })
                    .then(res => res.json())
                    .then(data2 => {
                        if (data2.success) {
                            alert('Phone login successful!');
                            // Simulate login
                            currentUser = { name: phone, username: phone };
                            userIcon.textContent = `👋 ${phone}`;
                            userBtn.onclick = logoutUser;
                            closeModal();
                        } else {
                            alert('Invalid OTP.');
                        }
                    });
                } else {
                    alert('Failed to send OTP.');
                }
            })
            .catch(() => alert('Phone login is not available.'));
        }
        // Initial render
        renderCategoryChips();
        renderProducts(products);
        updateCartCount();
        // On page load, ensure user is logged out
        logoutUser();
    </script>
</body>
</html>
